
name: Build Craftsmate APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Craftsmate-Android-V5-Pro-Workstation.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Craftsmate project
        run: |
          unzip -q Craftsmate-Android-V5-Pro-Workstation.zip
          echo "Project extracted"
          ls -la
          ls -la CraftsmateV4
          ls -la CraftsmateV4/app

      - name: Debug project configuration
        working-directory: CraftsmateV4
        run: |
          echo "Gradle files:"
          find . -maxdepth 3 \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradle.properties" \) \
            -print
          echo "Java version:"
          java -version
          echo "Gradle version:"
          gradle --version

      - name: Build Debug APK with detailed logs
        working-directory: CraftsmateV4
        run: |
          set -o pipefail
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Find APK
        if: success()
        run: |
          find CraftsmateV4/app/build/outputs \
            -type f -name "*.apk" -print

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Craftsmate-debug-apk
          path: CraftsmateV4/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
