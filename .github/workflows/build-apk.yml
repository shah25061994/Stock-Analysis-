name: Build Craftsmate APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Craftsmate-Android-V5-Pro-Workstation.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Craftsmate project
        run: |
          unzip -q Craftsmate-Android-V5-Pro-Workstation.zip
          echo "Project extracted"
          ls -la CraftsmateV4
          ls -la CraftsmateV4/app

      - name: Build Debug APK
        working-directory: CraftsmateV4
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find CraftsmateV4/app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Craftsmate-debug-apk
          path: CraftsmateV4/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14