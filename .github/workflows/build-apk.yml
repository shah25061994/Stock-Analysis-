name: Build Craftsmate APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Craftsmate-Android-V5-Pro-Workstation.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          unzip -o Craftsmate-Android-V5-Pro-Workstation.zip
          echo "Extracted project:"
          find . -maxdepth 3 -type f | sort | head -100

      - name: Build Debug APK
        working-directory: CraftsmateV4
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Craftsmate-debug-apk
          path: CraftsmateV4/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
